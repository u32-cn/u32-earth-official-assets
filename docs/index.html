<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>u32-earth-official-assets · 目录浏览</title>
<style>
  :root {
    --bg: #f6f7f9; --fg: #1f2328; --panel: #ffffff; --border: #d0d7de;
    --muted: #656d76; --accent: #0969da; --soft: #f0f3f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --panel: #161b22; --border: #30363d;
      --muted: #8b949e; --accent: #58a6ff; --soft: #21262d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { padding: 24px 28px 18px; border-bottom: 1px solid var(--border); background: var(--panel); }
  h1 { margin: 0 0 6px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); }
  main { padding: 20px 28px 40px; max-width: 960px; }
  .tree { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
  details { padding-left: 18px; }
  details > summary { cursor: pointer; list-style: none; margin: 2px 0; padding: 2px 6px; border-radius: 6px; }
  details > summary:hover { background: var(--soft); }
  details > summary::before { content: '▸ '; color: var(--muted); }
  details[open] > summary::before { content: '▾ '; }
  .dir-name { font-weight: 600; }
  .res-name { color: var(--accent); font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; margin-left: 8px; font-weight: 400; }
  .file { padding: 2px 6px 2px 34px; border-radius: 6px; color: var(--fg); text-decoration: none; display: block; }
  .file:hover { background: var(--soft); }
  .file .meta { margin-left: 8px; }
  .loading { color: var(--muted); padding: 6px; }
  .error { color: #cf222e; padding: 6px; }
</style>
</head>
<body>
<header>
  <h1>u32-earth-official-assets</h1>
  <p>目录结构浏览（数据来自各目录 <code>.u32-dir.json</code> 静态清单；含 <code>.u32-earth-assets.json</code> 的目录为 u32-earth 资源）</p>
</header>
<main><div class="tree" id="tree"><div class="loading">加载中…</div></div></main>

<script>
(function () {
  const $ = (s) => document.querySelector(s)

  function fmt(n) {
    if (n == null) return ''
    if (n < 1024) return n + ' B'
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB'
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB'
    return (n / 1073741824).toFixed(2) + ' GB'
  }

  async function fetchJson(url) {
    const r = await fetch(url, { cache: 'no-cache' })
    if (!r.ok) throw new Error('HTTP ' + r.status)
    return r.json()
  }

  /** 渲染一个目录：普通导航目录 = <details> 可展开（展开时才拉清单）；
   * 资源目录（含 .u32-earth-assets.json）= 整体叶子，不可展开、不暴露内部结构 */
  function renderDir(parentEl, dirUrl, name, isResource) {
    if (isResource) {
      const leaf = document.createElement('div')
      leaf.className = 'leaf'
      leaf.style.cssText = 'padding:2px 6px 2px 24px;border-radius:6px;'
      leaf.innerHTML = '<span class="res-name">' + name + '</span><span class="meta">u32-earth 资源</span>'
      parentEl.appendChild(leaf)
      return null
    }
    const box = document.createElement('details')
    const summary = document.createElement('summary')
    summary.innerHTML = '<span class="dir-name">' + name + '</span>'
    box.appendChild(summary)
    const body = document.createElement('div')
    body.innerHTML = '<div class="loading">…</div>'
    box.appendChild(body)
    let loaded = false
    box.addEventListener('toggle', () => {
      if (!box.open || loaded) return
      loaded = true
      loadDir(body, dirUrl)
    })
    parentEl.appendChild(box)
    return box
  }

  /** 拉目录清单并渲染子条目：file = 文件行；dir = 递归目录（尝试自述文件判资源） */
  async function loadDir(bodyEl, dirUrl) {
    try {
      const listing = await fetchJson(new URL('.u32-dir.json', dirUrl))
      if (listing.magic !== 'u32-dir-listing' || listing.version !== 1) {
        throw new Error('magic/version 不符：' + listing.magic + '@' + listing.version)
      }
      bodyEl.innerHTML = ''
      const entries = listing.data.entries
      if (entries.length === 0) { bodyEl.innerHTML = '<div class="loading">（空目录）</div>'; return }
      for (const e of entries) {
        const childUrl = new URL(e.name + (e.type === 'dir' ? '/' : ''), dirUrl).href
        if (e.type === 'dir') {
          // 目录：先探自述文件，有 = 资源目录（标色），无 = 普通导航目录
          const probe = fetchJson(new URL('.u32-earth-assets.json', childUrl)).then(
            (a) => ({ desc: a }),
            () => null,
          )
          probe.then((r) => {
            const item = renderDir(bodyEl, childUrl, e.name, r !== null)
            if (item !== null && r !== null && r.desc.data && r.desc.data.entries) {
              const names = r.desc.data.entries.map((x) => x.name).join('、')
              const types = [...new Set(r.desc.data.entries.map((x) => x.type))].join('、')
              item.querySelector('summary').innerHTML +=
                '<span class="meta">' + names + '（' + types + '）</span>'
            }
          })
        } else {
          const a = document.createElement('a')
          a.className = 'file'
          a.href = childUrl
          a.innerHTML = e.name + '<span class="meta">' + fmt(e.sizeBytes) + '</span>'
          bodyEl.appendChild(a)
        }
      }
    } catch (err) {
      bodyEl.innerHTML = '<div class="error">清单加载失败：' + err.message + '</div>'
    }
  }

  loadDir($('#tree'), new URL('assets/', location.href).href)
})()
</script>
</body>
</html>
